project:
  type: website
  output-dir: _preview
  execute-dir: project
  resources:
    - data/307102/README.md
    - data/307102/provenance.json
    - data/307102/students.csv
    - data/inferential-statistics/README.md
    - data/inferential-statistics/female_major_salaries.csv
    - data/inferential-statistics/graduate_salaries.csv
    - data/inferential-statistics/houses.csv
    - data/inferential-statistics/paired_scores.csv
    - data/inferential-statistics/provenance.json
    - data/inferential-statistics/teaching_gender.csv
    - data/inferential-statistics/teaching_methods.csv
    - data/module02/README.md
    - data/module02/audit_times.csv
    - data/module02/electronics_sales.csv
    - data/module02/measure_limitations_examples.csv
    - data/module02/restaurant_ratings.csv
    - data/module02/soft_drinks.csv
    - data/module02/student_age_height.csv
    - "!archived/**"
    - "!_instructor/**"
    - "!books/**"
  post-render:
    - python3 scripts/finalize-preview.py
  render:
    - index.qmd
    - 02-descriptive-statistics.qmd
    - 03-inferential-statistics.qmd
    - modules/01-introduction-to-r/**/*.qmd
    - "!archived/**"
    - "!_instructor/**"
website:
  site-url: https://msfasha.github.io/307312-Applied-Statistics/
  title: "307312 Applied Statistics - Masters Level"
  navbar:
    left:
      - text: "Course"
        href: index.qmd
      - text: "Part 1: Introduction to R"
        href: modules/01-introduction-to-r/index.qmd
      - text: "Part 2: Descriptive statistics"
        href: 02-descriptive-statistics.qmd
      - text: "Part 3: Inferential statistics"
        href: 03-inferential-statistics.qmd
format:
  html:
    theme: cosmo
    css:
      - assets/petra-brand.css
      - assets/source-slides.css
    toc: true
    code-copy: true
execute:
  freeze: false
