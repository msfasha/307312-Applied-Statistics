project:
  type: website
  output-dir: _build/website
  execute-dir: project
  resources:
    - data/business/superstore-lines.csv
    - data/business/cola.csv
    - data/business/consumer.csv
    - data/business/README.md
    - "!archived/**"
    - "!instructor/**"
    - "!books/**"
    - "!sources/**"
    - "!practicals/**"
    - "!_build/**"
  post-render:
    - python3 scripts/finalize-preview.py
    - python3 scripts/preview-practicals.py
    - python3 scripts/stage-practicals.py
  render:
    - index.qmd
    - lessons/01-introduction-to-r.qmd
    - lessons/02-descriptive-statistics.qmd
    - lessons/03-inferential-statistics.qmd
    - "!archived/**"
    - "!instructor/**"
website:
  site-url: https://msfasha.github.io/307312-Applied-Statistics/
  title: "307312 Applied Statistics - Masters Level"
  navbar:
    left:
      - text: "Course"
        href: index.qmd
      - text: "Part 1: Introduction to R"
        href: lessons/01-introduction-to-r.qmd
      - text: "Part 2: Descriptive statistics"
        href: lessons/02-descriptive-statistics.qmd
      - text: "Practicals"
        href: index.qmd#part-2-practicals
      - text: "Part 3: Inferential statistics"
        href: lessons/03-inferential-statistics.qmd
format:
  html:
    theme: cosmo
    css:
      - assets/petra-brand.css
      - assets/source-slides.css
      - assets/practical-print.css
    toc: true
    code-copy: true
execute:
  freeze: false
