project:
  type: website
  output-dir: _build/website
  execute-dir: project
  resources:
    - data/r-introduction/superstore.csv
    - data/r-introduction/README.md
    - data/descriptive-statistics/students.csv
    - data/descriptive-statistics/README.md
    - data/inferential-statistics/paired_scores.csv
    - data/inferential-statistics/graduate_salaries.csv
    - data/inferential-statistics/female_major_salaries.csv
    - data/inferential-statistics/teaching_methods.csv
    - data/inferential-statistics/teaching_gender.csv
    - data/inferential-statistics/houses.csv
    - data/inferential-statistics/README.md
    - data/business/superstore-lines.csv
    - data/business/cola.csv
    - data/business/consumer.csv
    - data/business/README.md
    - data/business/extended-herald-calls.csv
    - data/business/extended-herald-marketing.csv
    - data/business/extended-herald-subscriptions.csv
    - data/business/extended-oxford-summary.csv
    - data/business/extended-parachute.csv
    - data/business/extended-potato.csv
    - data/business/extended-harnswell.csv
    - "!archived/**"
    - "!instructor/**"
    - "!books/**"
    - "!sources/**"
    - "!practicals/**"
    - "!_build/**"
  post-render:
    - python3 scripts/finalize-preview.py
    - python3 scripts/preview-practicals.py
    - python3 scripts/stage-practicals.py
  render:
    - index.qmd
    - lessons/01-introduction-to-r.qmd
    - lessons/r-02-basic-concepts.qmd
    - lessons/r-03-dplyr.qmd
    - lessons/r-04-ggplot2.qmd
    - lessons/02-descriptive-statistics.qmd
    - lessons/03-inferential-statistics.qmd
    - extended-cases/case-01-springville-herald.qmd
    - extended-cases/case-02-oxford-cereal.qmd
    - extended-cases/case-03-retail-display.qmd
    - extended-cases/case-04-perfect-parachute.qmd
    - extended-cases/case-05-mountain-states-potato.qmd
    - extended-cases/case-06-harnswell-quality.qmd
    - "!archived/**"
    - "!instructor/**"
website:
  site-url: https://msfasha.github.io/307312-Applied-Statistics/
  title: "307312 Applied Statistics - Masters Level"
  navbar:
    left:
      - text: "Course"
        href: index.qmd
      - text: "Part 1: Introduction to R"
        menu:
          - text: "1. Introduction to R"
            href: lessons/01-introduction-to-r.qmd
          - text: "2. Basic Concepts in R"
            href: lessons/r-02-basic-concepts.qmd
          - text: "3. Data Manipulation using dplyr"
            href: lessons/r-03-dplyr.qmd
          - text: "4. Introduction to ggplot2"
            href: lessons/r-04-ggplot2.qmd
      - text: "Part 2: Descriptive statistics"
        href: lessons/02-descriptive-statistics.qmd
      - text: "Practicals"
        href: index.qmd#part-2-practicals
      - text: "Part 3: Inferential statistics"
        href: lessons/03-inferential-statistics.qmd
      - text: "Extended cases"
        href: index.qmd#extended-business-cases
format:
  html:
    theme: cosmo
    css:
      - assets/petra-brand.css
      - assets/source-slides.css
      - assets/practical-print.css
    toc: true
    code-copy: true
execute:
  freeze: false
