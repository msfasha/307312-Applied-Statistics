<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">From variable type to an interpretable display</title><desc id="desc">Categorical variables lead to category counts and bar or pie charts. Numerical variables lead to interval counts and histograms, or to dot plots of individual values. Interpret both with a denominator, units, and limits.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#586978"/></marker></defs>
<rect width="1000" height="350" rx="12" fill="#F8FAFC"/>
<g font-family="Arial,sans-serif" fill="#2F343B" text-anchor="middle">
<g fill="#EDF3F6" stroke="#D0DAE1"><rect x="22" y="25" width="230" height="100" rx="7"/><rect x="22" y="155" width="230" height="110" rx="7"/><rect x="355" y="25" width="260" height="100" rx="7"/><rect x="355" y="155" width="260" height="110" rx="7"/><rect x="720" y="25" width="258" height="100" rx="7"/><rect x="720" y="155" width="258" height="110" rx="7"/></g>
<g font-size="23" font-weight="bold"><text x="137" y="64">Categorical</text><text x="485" y="64">Category frequencies</text><text x="849" y="64">Bar / pie chart</text><text x="137" y="194">Numerical</text><text x="485" y="194">Class frequencies</text><text x="849" y="194">Histogram</text></g>
<g font-size="19"><text x="137" y="100">Which category?</text><text x="485" y="100">Counts and percentages</text><text x="849" y="100">Compare category shares</text><text x="137" y="230">How many / how much?</text><text x="485" y="230">Explicit class boundaries</text><text x="849" y="227">Reveal the distribution</text><text x="849" y="251">Dot plot: retain exact values</text></g>
<g stroke="#586978" stroke-width="2" marker-end="url(#a)"><path d="M263 75H341"/><path d="M626 75H706"/><path d="M263 210H341"/><path d="M626 210H706"/></g>
<text x="500" y="313" font-size="23" font-weight="bold">Interpret: state the denominator, units, finding, and limits.</text>
</g></svg>
