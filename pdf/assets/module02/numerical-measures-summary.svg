<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Three questions for numerical summaries</title><desc id="desc">Center describes typical values; variability describes spread; position describes where a value lies. Use meaningful variables, units, a stated quartile convention, and a distribution plot.</desc>
<rect width="1000" height="320" rx="12" fill="#F8FAFC"/>
<g font-family="Arial,sans-serif" fill="#2F343B" text-anchor="middle">
<g fill="#EDF3F6" stroke="#D0DAE1"><rect x="25" y="28" width="300" height="188" rx="8"/><rect x="350" y="28" width="300" height="188" rx="8"/><rect x="675" y="28" width="300" height="188" rx="8"/></g>
<g font-size="27" font-weight="bold"><text x="175" y="75">Center</text><text x="500" y="75">Variability</text><text x="825" y="75">Position</text></g>
<g font-size="21"><text x="175" y="115">What is typical?</text><text x="175" y="155">Mean · Median · Mode</text><text x="175" y="190">Magnitude, rank, frequency</text><text x="500" y="115">How much do values differ?</text><text x="500" y="155">Range · SD · IQR</text><text x="500" y="190">Read spread with center</text><text x="825" y="115">Where does a value sit?</text><text x="825" y="155">Quartiles · Z-scores</text><text x="825" y="190">Rank or SD units</text></g>
<text x="500" y="264" font-size="23" font-weight="bold">Meaningful variables + units + conventions + a distribution plot</text>
<text x="500" y="297" font-size="19">A summary describes the data; an unusual value needs investigation.</text>
</g></svg>
