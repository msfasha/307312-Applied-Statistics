<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">The descriptive statistics toolbox</title><desc id="desc">After identifying the variable and question, use tables to organize observations, charts to reveal patterns, and numerical measures to summarize magnitude and variability. Interpret them together.</desc>
<rect width="1000" height="350" rx="16" fill="#F8FAFC"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#202A33">
<text x="500" y="40" font-size="24" font-weight="bold">One question, three complementary tools</text>
<g stroke="#BBC7D2" fill="white"><rect x="25" y="70" width="300" height="190" rx="12"/><rect x="350" y="70" width="300" height="190" rx="12"/><rect x="675" y="70" width="300" height="190" rx="12"/></g>
<g font-size="26" font-weight="bold"><text x="175" y="110">Tables</text><text x="500" y="110">Charts</text><text x="825" y="110">Numerical measures</text></g>
<g font-size="20"><text x="175" y="155">Organize and compare</text><text x="175" y="190">Counts and percentages</text><text x="175" y="225">Grouped frequencies</text><text x="500" y="155">See the pattern</text><text x="500" y="190">Shape and unusual values</text><text x="500" y="225">Group differences</text><text x="825" y="155">Quantify the pattern</text><text x="825" y="190">Center and spread</text><text x="825" y="225">Position and association</text></g>
<rect x="100" y="285" width="800" height="42" rx="8" fill="#E8EFF4"/>
<text x="500" y="313" font-size="21" font-weight="bold">Interpret the evidence in the context of the question.</text>
</g></svg>
