# Independent Superstore practical project, staged by the root website build.
project:
  type: default
  output-dir: ../_build/practicals
  execute-dir: file
  post-render:
    - python3 ../scripts/finalize-practical-preview.py
  render:
    - practical-01-categorical-business-data.qmd
    - practical-02-numerical-business-data.qmd
    - practical-03-association-and-groups.qmd
    - practical-01-cereals.qmd
format:
  html:
    theme: cosmo
    css:
      - ../assets/petra-brand.css
      - ../assets/practical-print.css
