<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Positron course workspace overview</title>
  <desc id="desc">Schematic of a folder opened in Positron. The Explorer contains course files, the editor contains explanations and R cells, the Console displays results, and the Session pane shows variables and plots.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#292929;font-size:22px}
    .label{font-size:25px;font-weight:700}.small{font-size:19px}.code{font-family:monospace;font-size:22px}
    .panel{fill:#fafafa;stroke:#bdbdbd;stroke-width:2}.band{fill:#e5e5e5}
  </style>
  <rect x="4" y="4" width="1092" height="562" rx="9" fill="white" stroke="#a6a6a6" stroke-width="2"/>
  <path d="M13 5H1087Q1095 5 1095 13V68H5V13Q5 5 13 5" fill="#dedede"/>
  <text x="26" y="44" class="label">Open Folder → your course folder</text>
  <rect x="20" y="88" width="240" height="456" class="panel"/>
  <rect x="21" y="89" width="238" height="51" class="band"/>
  <text x="36" y="124" class="label">Explorer</text>
  <text x="36" y="180" class="small">Find your course files</text>
  <text x="36" y="229" class="code">_quarto.yml</text>
  <text x="36" y="270" class="code">data/</text>
  <text x="36" y="311" class="code">assets/</text>
  <text x="36" y="365" class="small">Open a .qmd notebook</text>
  <text x="36" y="391" class="small">from its course folder</text>
  <rect x="280" y="88" width="514" height="253" class="panel"/>
  <rect x="281" y="89" width="512" height="51" class="band"/>
  <text x="298" y="124" class="label">Source editor</text>
  <text x="303" y="187" class="small">Read explanations and run R cells</text>
  <text x="303" y="241" class="small">Explanations and R code cells</text>
  <text x="303" y="279" class="small">Run cells in order</text>
  <rect x="280" y="359" width="514" height="185" class="panel"/>
  <rect x="281" y="360" width="512" height="51" class="band"/>
  <text x="298" y="395" class="label">R Console</text>
  <text x="303" y="457" class="small">Commands and results</text>
  <text x="303" y="509" class="small">Commands run from the course root</text>
  <rect x="814" y="88" width="266" height="210" class="panel"/>
  <rect x="815" y="89" width="264" height="51" class="band"/>
  <text x="832" y="124" class="label">Variables</text>
  <text x="837" y="188" class="small">Inspect your objects</text>
  <text x="837" y="252" class="small">after running a cell</text>
  <rect x="814" y="316" width="266" height="228" class="panel"/>
  <rect x="815" y="317" width="264" height="51" class="band"/>
  <text x="832" y="352" class="label">Plots and Viewer</text>
  <text x="837" y="414" class="small">Inspect your charts</text>
  <text x="837" y="458" class="small">Preview the rendered</text>
  <text x="837" y="484" class="small">Quarto document</text>
</svg>
