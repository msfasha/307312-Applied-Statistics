name: Build and publish synchronized course

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-course.yml]

permissions:
  contents: write

concurrency:
  group: applied-statistics-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils fonts-liberation
          python3 -m pip install PyYAML
          command -v google-chrome
      - name: Install course R packages
        shell: Rscript {0}
        run: |
          install.packages(c("knitr", "rmarkdown", "dplyr", "ggplot2", "readr",
                             "tidyr", "zoo", "e1071", "MASS"))
      - name: Build, validate and publish all five formats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/publish-course.py
          git fetch origin gh-pages
          echo "PUBLICATION_COMMIT=$(git rev-parse origin/gh-pages)"
          echo "PUBLICATION_TREE=$(git rev-parse 'origin/gh-pages^{tree}')"
      - name: Save the exact built release for live verification
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-course-release
          path: _build/website/
          retention-days: 7
          include-hidden-files: true
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: synchronized-course-release
          path: _build/website/
      - name: Verify deployed revision and every download byte
        run: python3 scripts/verify-live-course.py
      - name: Save live verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-course-verification
          path: _build/extended-review/live-verification.json
          if-no-files-found: ignore
          retention-days: 7
